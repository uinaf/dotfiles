# Shared runtime and tool pins for every platform. This file and the
# darwin/ and linux/ siblings stay plain TOML so Renovate's mise manager can
# parse them; chezmoi concatenates them into ~/.config/mise/config.toml.
[tools]
node = "24.21.0"
bun = "1.4.2"
python = "3.14.7"
java = "temurin-21"
ruby = "4.0.6"
uv = "0.12.13"
go = "1.27.1"
# 0.1.19 dropped npm trusted-publisher metadata and provenance.
"npm:@playwright/cli" = "0.1.18"
# Coding agents share one pin on every platform. Cursor keeps its own installer.
"npm:@openai/codex" = "0.154.0"
# T3 Code's CLI installs its background service; the service updates itself.
"npm:t3" = "0.0.40"

# Command-line tools with binary releases live here on both platforms so one
# pin serves macOS and Linux. Homebrew keeps what needs a compiler or a GUI
# (git, tmux, ffmpeg, watchman, the Docker and Colima stack, casks) and, on
# macOS, what privileged or secret-handling flows call by fixed path: age and
# sops for the sudo askpass helper, xcodes for the root Xcode selection. On
# Linux the host provides age and sops the same way.
gh = "2.100.0"
jq = "1.8.2"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
chezmoi = "2.72.1"
direnv = "2.37.1"
gitleaks = "8.30.1"
trufflehog = "3.97.4"
topgrade = "17.10.1"
opencode = "1.18.30"
awscli = "2.36.44"
glab = "1.117.0"
git-filter-repo = "2.47.0"

[tools]
node = "24.21.0"
bun = "1.4.2"
python = "3.14.7"
java = "temurin-21"
ruby = "4.0.6"
uv = "0.12.13"
go = "1.27.1"
# 0.1.19 dropped npm trusted-publisher metadata and provenance.
"npm:@playwright/cli" = "0.1.18"
# Coding agents share one pin on every platform. Cursor keeps its own installer.
"npm:@openai/codex" = "0.154.0"
"npm:@anthropic-ai/claude-code" = "2.1.269"
{{- if eq .chezmoi.os "linux" }}
# Linux has no Homebrew layer; the tools the shared Brewfile supplies on macOS
# come from mise here. tmux and zsh are distribution packages the host owns.
age = "1.3.2"
sops = "3.13.3"
gh = "2.100.0"
jq = "1.8.2"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
chezmoi = "2.72.1"
direnv = "2.37.1"
btop = "1.4.7"
gitleaks = "8.30.1"
"npm:opencode-ai" = "1.18.30"
{{- end }}

[tasks."dotfiles:runtime-packages"]
description = "Converge packages inside the managed runtimes"
run = [
  "npm install --global npm@12.0.2",
  "npm install --global corepack@0.36.0",
  "corepack enable pnpm && corepack install --global pnpm@12.3.4",
  "python -m pip install --disable-pip-version-check PyYAML==6.0.3",
]

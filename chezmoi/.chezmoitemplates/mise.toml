[tools]
node = "24.20.0"
bun = "1.4.0"
python = "3.14.7"
java = "temurin-21"
ruby = "4.0.6"
uv = "0.12.9"
go = "1.27.1"
# 0.1.19 dropped npm trusted-publisher metadata and provenance.
"npm:@playwright/cli" = "0.1.18"

[tasks."dotfiles:runtime-packages"]
description = "Converge packages inside the managed runtimes"
run = [
  "npm install --global npm@12.0.2",
  "corepack enable pnpm && corepack install --global pnpm@12.3.4",
  "python -m pip install --disable-pip-version-check PyYAML==6.0.3",
]
